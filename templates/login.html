{% extends "base.html" %} {% block content %}

<div class="auth-container">
    <div class="auth-card">
        <h2>Sign In</h2>
        <p class="sub-text" style="text-align: center; margin-bottom: 24px;">Enter your credentials to access your dashboard</p>
        
        <form method="POST">
            <label for="login-email">Email Address</label>
            <input
                id="login-email"
                type="email"
                name="email"
                placeholder="name@example.com"
                required
            />
            
            <label for="login-password">Password</label>
            <input 
                id="login-password"
                type="password" 
                name="password" 
                placeholder="••••••••" 
                required 
            />
            
            <button type="submit" style="margin-top: 8px;">Sign In</button>
        </form>
        
        <p class="switch-auth">
            Don't have an account yet? <a href="/signup">Sign up</a>
        </p>
    </div>
</div>

{% endblock %}
